name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :core-domain:test :app:testDebugUnitTest --stacktrace
      - name: Assemble optimised APK
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: foldmail-debug-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FoldMail-debug.apk
          # Remove every old "latest" release, drafts included (a draft is invisible to "gh release delete <tag>").
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="latest") | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
          done
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" || true
          gh release create latest FoldMail-debug.apk --title "FoldMail debug APK" --notes "Automatický build z commitu ${GITHUB_SHA::7}" --target "$GITHUB_SHA" --latest --draft=false
          # Make sure it is published and not left as a draft: repeat until the download link really answers.
          for attempt in 1 2 3 4 5 6; do
            rid=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="latest") | .id' | head -1 || true)
            if [ -n "$rid" ]; then gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$rid" -F draft=false --jq '{id,draft,tag_name}' || true; else echo "release not listed yet"; fi
            sleep 8
            code=$(curl -s -o /dev/null -L -w "%{http_code}" "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/FoldMail-debug.apk" || true)
            echo "attempt $attempt: download link answers $code"
            [ "$code" = "200" ] && break
          done
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | {id,draft,tag_name,created_at}' || true
