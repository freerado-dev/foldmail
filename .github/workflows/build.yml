name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :core-domain:test :app:testDebugUnitTest --stacktrace
      - name: Assemble optimised APK
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: foldmail-debug-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FoldMail-debug.apk
          # Remove every old "latest" release, drafts included (a draft is invisible to "gh release delete <tag>").
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="latest") | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
          done
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" || true
          gh release create latest FoldMail-debug.apk --title "FoldMail debug APK" --notes "Automatický build z commitu ${GITHUB_SHA::7}" --target "$GITHUB_SHA" --latest
          # Make sure it is published and not left as a draft.
          gh release edit latest --draft=false
