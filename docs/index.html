<h1>FoldMail</h1>
<p>FoldMail je osobný emailový klient pre Android, ktorý vznikol pre súkromné použitie jedného používateľa. Zobrazuje emaily po osobách ako konverzácie a podporuje účty Gmail a IMAP/POP3.</p>
<p>Aplikácia nie je verejne distribuovaná.</p>
